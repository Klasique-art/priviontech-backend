services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: privion
      POSTGRES_PASSWORD: privion
      POSTGRES_DB: privion
    ports:
      - "5433:5432"
    volumes:
      - privion_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U privion"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  privion_postgres:
